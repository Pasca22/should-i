name: should-i

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: should_i
      POSTGRES_PASSWORD: should_i
      POSTGRES_DB: should_i
    ports:
      - "5440:5432"
    volumes:
      # Postgres 18 keeps its data in a versioned folder under /var/lib/postgresql, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U should_i -d should_i"]
      # Fast checks while starting (so `docker compose up --wait` returns quickly), then rarely.
      start_period: 20s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
